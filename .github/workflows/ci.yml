name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned project and test dependencies
        run: python -m pip install -e ".[test,tui]"
      - name: Run default test suite
        run: python -m pytest -q
